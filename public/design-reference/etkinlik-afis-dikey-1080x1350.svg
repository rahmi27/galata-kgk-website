<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Dikey etkinlik afişi ölçü taslağı — 1080 × 1350 piksel</title>
  <desc id="desc">Izgara, köşe işaretleri, 72 ve 90 piksellik önerilen güvenli alan ve afişin altındaki modal bilgi bandı açıklaması.</desc>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#5c719a" stroke-width="2" opacity=".34"/></pattern>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="18" height="18" fill="#ec6c3b" opacity=".10"/><path d="M0 0V18" stroke="#ff9a67" stroke-width="4" opacity=".35"/></pattern>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#111d3e"/><stop offset="1" stop-color="#273765"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#base)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <path d="M0 0H1080V90H0ZM0 1260H1080V1350H0ZM0 90H72V1260H0ZM1008 90H1080V1260H1008Z" fill="url(#hatch)"/>
  <rect x="72" y="90" width="936" height="1170" fill="none" stroke="#ff9a67" stroke-width="4" stroke-dasharray="18 12"/>
  <g fill="none" stroke="#ff8b55" stroke-width="9"><path d="M18 94V18H94M986 18h76v76M18 1256v76h76M986 1332h76v-76"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <text x="540" y="248" font-size="29" font-weight="700" letter-spacing="7" fill="#ffad7d">GALATA KGK · TEKNİK TASLAK</text>
    <text x="540" y="560" font-size="66" font-weight="800">DİKEY AFİŞ ALANI</text>
    <text x="540" y="640" font-size="49" font-weight="700" fill="#ffad7d">1080 × 1350 px · 4:5</text>
    <text x="540" y="714" font-size="28">Tüm afiş object-contain ile görünür; otomatik kırpma yok.</text>
    <text x="540" y="774" font-size="26" fill="#cbd8f2">Kesikli çizginin içi: önemli metin ve logo için güvenli alan.</text>
  </g>
  <rect x="110" y="926" width="860" height="252" rx="8" fill="#101a36" stroke="#ff8b55" stroke-width="3"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <text x="540" y="989" font-size="29" font-weight="700" fill="#ffad7d">MODAL YERLEŞİM NOTU</text>
    <text x="540" y="1040" font-size="27">Açıklama ve buton AFİŞİN DIŞINDA, altında görünür.</text>
    <text x="540" y="1088" font-size="24">Masaüstü: metin solda · buton sağda, 48 px yüksek.</text>
    <text x="540" y="1134" font-size="24">Mobil: metin üstte · buton tam genişlik, 48 px yüksek.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffd0ad"><text x="94" y="68">ÜST: 90 px</text><text x="94" y="1300">ALT: 90 px</text></g>
</svg>
